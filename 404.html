<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Ayush Patil</title>
    <meta
      name="description"
      content="That page doesn't exist. Head back to Ayush Patil's portfolio to explore projects, services and contact details."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/assets/mark.webp" type="image/webp" />
    <style>
      @font-face {
        font-family: "Roboto Flex";
        font-style: normal;
        font-display: swap;
        font-weight: 100 1000;
        src: url("/fonts/roboto-flex-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Roboto Mono";
        font-style: normal;
        font-display: swap;
        font-weight: 100 700;
        src: url("/fonts/roboto-mono-latin.woff2") format("woff2");
      }

      :root {
        color-scheme: light;
        --surface: #f4efe6;
        --surface-low: #fffdfa;
        --on-surface: #2f241e;
        --on-surface-variant: #6b5a4d;
        --outline-variant: #d8cbbb;
        --primary: #a9241c;
        --accent: #c6423c;
        --accent-soft: #f9ddd6;
        --chip-bg: #f6e6b4;
        --chip-fg: #3f2a00;
        --button-fg: #fff9f1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --surface: #1e1512;
          --surface-low: #291d18;
          --on-surface: #f0e4d6;
          --on-surface-variant: #c9b29e;
          --outline-variant: #4d362b;
          --primary: #f0a08d;
          --accent: #b8453f;
          --accent-soft: #6a241b;
          --chip-bg: #44330c;
          --chip-fg: #f7dfa0;
          --button-fg: #fff4e8;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: clamp(20px, 5vw, 48px);
        place-items: center;
        background:
          radial-gradient(60% 50% at 12% 0%, var(--accent-soft) 0%, transparent 70%),
          radial-gradient(50% 45% at 92% 100%, var(--chip-bg) 0%, transparent 72%),
          var(--surface);
        color: var(--on-surface);
        font-family: "Roboto Flex", "Roboto", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid var(--outline-variant);
        border-radius: 24px;
        background: var(--surface-low);
        text-align: center;
      }

      .mark {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 18px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--chip-fg);
        font-family: "Roboto Mono", ui-monospace, monospace;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.08;
        text-wrap: balance;
      }

      h1 span {
        color: var(--primary);
      }

      p {
        margin: 0 auto 30px;
        max-width: 42ch;
        color: var(--on-surface-variant);
        font-size: 1rem;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      a:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      .primary {
        background: var(--accent);
        color: var(--button-fg);
      }

      .primary:hover {
        background: var(--primary);
      }

      .secondary {
        border-color: var(--outline-variant);
        color: var(--on-surface);
      }

      .secondary:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .foot {
        margin: 32px 0 0;
        color: var(--on-surface-variant);
        font-family: "Roboto Mono", ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/assets/mark.webp" type="image/webp" />
        <img
          class="mark"
          src="/assets/mark.png"
          width="96"
          height="96"
          alt="Ayush Patil crowned chicken mark"
        />
      </picture>
      <p class="eyebrow">Error 404</p>
      <h1>This page flew <span>the coop.</span></h1>
      <p>
        The link is broken, moved, or never existed. The portfolio is still right here — projects,
        stack, services and a direct line to me.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="mailto:ayushrepos@outlook.com">Email me</a>
      </div>
      <p class="foot">Ayush Patil · Mumbai, India</p>
    </main>
  </body>
</html>
